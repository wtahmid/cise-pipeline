name: Reusable - Secrets Scan

# Detects accidentally committed credentials (AWS keys, tokens, passwords,
# private keys) across the ENTIRE git history. A secret committed and later
# deleted is still a leak for anyone who cloned the repo — that is why
# `fetch-depth: 0` is mandatory here.

on:
  workflow_call:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
