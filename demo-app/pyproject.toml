[project]
name = "demo-app"
version = "0.1.0"
description = "Minimal stdlib-only demo app for the CISE CI/CD Security & SBOM pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit",
    "pip-audit",
    "ruff",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["demo_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
